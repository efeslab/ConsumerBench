# Coding Session Workflow (No Model Reuse, No ImageGen)
# Same as workflow_coding_session.yml but without the ImageGen stage.
# The llama.cpp model is loaded/unloaded 4 times (3x Chatbot + 1x DeepResearch).

Code Generation (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 20
    device: gpu
    type: Chatbot
    mps: 100

Code Review (deep_research):
    server_model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    client_model: openai/meta-llama/Llama-3.2-3B-Instruct
    num_requests: 1
    device: gpu
    type: DeepResearch
    mps: 100

Bug Fix (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 15
    device: gpu
    type: Chatbot
    mps: 100

Documentation (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100

workflows:
    code_gen:
        uses: Code Generation (chatbot)

    code_review:
        uses: Code Review (deep_research)
        depend_on: ["code_gen"]

    bug_fix:
        uses: Bug Fix (chatbot)
        depend_on: ["code_review"]

    documentation:
        uses: Documentation (chatbot)
        depend_on: ["bug_fix"]
