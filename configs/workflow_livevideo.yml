# Real-time video understanding on a bare llama.cpp VLM server.
#
# Everything not listed here comes from LiveVideo.get_default_config(): 10s
# chunks, 8 frames each scaled to 448px, real-time pacing, 131072 context on a
# single slot, and one pass over the video. See applications/LiveVideo/README.md
# for the full list and what each knob trades off.
#
# Per-chunk timings land in results/livevideo_8083_session0_chunks.csv.

live1:
    type: LiveVideo
    num_requests: 1
    model: models/Qwen3-VL-8B-Instruct-GGUF/Qwen3VL-8B-Instruct-Q4_K_M.gguf
    api_port: 8083
    device: gpu
    mps: 100
    video_path: applications/VSS/my_video.mp4

workflows:
    live_video:
        uses: live1
