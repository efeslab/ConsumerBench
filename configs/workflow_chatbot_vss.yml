# Chatbot and the VSS video agent contending for one GPU on the Spark.
#
# Each runs its own llama-server: the chatbot's on 8080, VSS's on 8081. They are
# separate processes holding separate copies of their weights, so size the two
# models and the mps split against the VLM's footprint too.

chat1:
    type: Chatbot
    num_requests: 10
    model: models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    device: gpu
    api_port: 8080
    mps: 50

vss1:
    type: VSS
    num_requests: 1
    llm_model: models/Qwen2.5-7B-Instruct-GGUF/qwen2.5-7b-instruct-q5_k_m-00001-of-00002.gguf
    vlm_model: nvidia/cosmos-reason2-8b
    llm_port: 8081
    mps: 50
    video_path: applications/VSS/my_video.mp4
    prompt: "Summarize what happens in this video."

workflows:
    chat:
        uses: chat1

    summarize_video:
        uses: vss1
