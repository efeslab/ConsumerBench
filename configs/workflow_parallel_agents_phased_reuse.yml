# Parallel Coding Agents Workflow (Phased + Model Reuse)
# Combines both workflow-aware optimizations:
# 1. Same-model agents serialized to avoid contention (phased)
# 2. Model kept loaded between LLM stages to avoid redundant loading (reuse)
#
# This achieves the best of both worlds: no contention on the shared inference
# server AND no redundant model loading overhead. Only possible when the system
# has full knowledge of the workflow DAG.

Planning (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100

Frontend Code (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 15
    device: gpu
    type: Chatbot
    mps: 100

Backend Analysis (deep_research):
    server_model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    client_model: openai/meta-llama/Llama-3.2-3B-Instruct
    num_requests: 1
