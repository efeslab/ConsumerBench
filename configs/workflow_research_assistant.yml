# Research Assistant Workflow (Concurrent - All Parallel Fan-Out)
# Simulates a user doing AI-powered research: literature search, brainstorming,
# deep analysis, report writing, and figure generation.
# Covers 4 application types: Retriever, Chatbot, DeepResearch, ImageGen.
#
# DAG structure:
#   search (Retriever) ──┐
#                         ├──> summarize (Chatbot) ──> write_report (Chatbot) ──> figures (ImageGen)
#   brainstorm (Chatbot) ─┤
#                         └──> deep_analysis (DeepResearch)
#
# After the initial parallel fan-out (search + brainstorm), both summarize and
# deep_analysis run concurrently (contending for the shared llama.cpp server).

Literature Search (retriever):
    num_requests: 5
    device: cpu
    type: Retriever

Brainstorm Ideas (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100

Summarize Findings (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100

Deep Analysis (deep_research):
    server_model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    client_model: openai/meta-llama/Llama-3.2-3B-Instruct
    num_requests: 1
    device: gpu
    type: DeepResearch
    mps: 100

Write Report (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 15
    device: gpu
    type: Chatbot
    mps: 100

Generate Figures (imagegen):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/stable-diffusion-3.5-medium-turbo
    num_requests: 5
    device: gpu
    type: ImageGen
    mps: 100

workflows:
    # Phase 1: Parallel information gathering
    search:
        uses: Literature Search (retriever)

    brainstorm:
        uses: Brainstorm Ideas (chatbot)

    # Phase 2: Concurrent processing (contention point - both use llama.cpp)
    summarize:
        uses: Summarize Findings (chatbot)
        depend_on: ["search", "brainstorm"]

    deep_analysis:
        uses: Deep Analysis (deep_research)
        depend_on: ["search", "brainstorm"]

    # Phase 3: Sequential report generation
    write_report:
        uses: Write Report (chatbot)
        depend_on: ["summarize", "deep_analysis"]

    # Phase 4: Figure generation
    figures:
        uses: Generate Figures (imagegen)
        depend_on: ["write_report"]
