# Coding Session Workflow (With Model Reuse)
# Same workflow as workflow_coding_session.yml, but with keep_model_loaded enabled.
# The llama.cpp server stays alive between stages that share the same model,
# eliminating redundant model loading/unloading.
# Model is loaded only once and unloaded only at the final LLM stage.

Code Generation (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 20
    device: gpu
    type: Chatbot
    mps: 100

Code Review (deep_research):
    server_model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    client_model: openai/meta-llama/Llama-3.2-3B-Instruct
    num_requests: 1
    device: gpu
    type: DeepResearch
    mps: 100

Bug Fix (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 15
    device: gpu
    type: Chatbot
    mps: 100

Documentation (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100

Architecture Diagrams (imagegen):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/stable-diffusion-3.5-medium-turbo
    num_requests: 5
    device: gpu
    type: ImageGen
    mps: 100

workflows:
    code_gen:
        uses: Code Generation (chatbot)
        keep_model_loaded: true

    code_review:
        uses: Code Review (deep_research)
        depend_on: ["code_gen"]
        keep_model_loaded: true

    bug_fix:
        uses: Bug Fix (chatbot)
        depend_on: ["code_review"]
        keep_model_loaded: true

    documentation:
        uses: Documentation (chatbot)
        depend_on: ["bug_fix"]

    diagrams:
        uses: Architecture Diagrams (imagegen)
        depend_on: ["documentation"]
