# 3 Parallel Agents — Naive (Uncoordinated) — Different Models + Real Tools
#
# Three agents with DIFFERENT LLM models on separate ports, plus real tools:
#   DB Agent:   Llama-3.2-3B  (port 8080) + DbBench (MySQL)
#   OS Agent:   Qwen2.5-3B   (port 8081) + OsTool  (Docker bash)
#   Chat Agent: Phi-3.5-mini  (port 8082) + OsTool  (Docker bash)
#
# All three run fully independently in parallel — no cross-agent dependencies.
# Different models means NO batching — true GPU compute contention.

# ---- Application unit definitions ----

DB Agent LLM:
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 5
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8080

DB Agent Tool:
    type: DbBench
    num_requests: 5
    tool_kwargs:
        tool: mysql
        num_runs: 1
        data_file: /home/yilegu/ConsumerBench/ConsumerBench/applications/DbBench/data_dbbench.jsonl
        query: "SELECT * FROM unknown WHERE Pos = 'FW'"

OS Agent LLM:
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Qwen2.5-3B-Instruct-GGUF/qwen2.5-3b-instruct-q8_0.gguf
    num_requests: 5
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8081

OS Agent Tool:
    type: OsTool
    num_requests: 5
    tool_kwargs:
        tool: bash
        num_runs: 1
        data_file: /home/yilegu/ConsumerBench/ConsumerBench/applications/OSTool/data/data_dental.json

Chat Agent LLM:
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Phi-3.5-mini-instruct-GGUF/Phi-3.5-mini-instruct-Q8_0.gguf
    num_requests: 5
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8082

Chat Agent Tool:
    type: OsTool
    num_requests: 5
    tool_kwargs:
        tool: bash
        num_runs: 1
        data_file: /home/yilegu/ConsumerBench/ConsumerBench/applications/OSTool/data/data_amazon.json

# ---- Workflow DAG ----
# All three agent chains start in parallel (no cross-agent deps).
# Pattern per agent: LLM_1 -> Tool -> LLM_2

workflows:
    # DB Agent chain
    db_llm_1:
        uses: DB Agent LLM
    db_tool_1:
        uses: DB Agent Tool
        depend_on: ["db_llm_1"]
    db_llm_2:
        uses: DB Agent LLM
        depend_on: ["db_tool_1"]

    # OS Agent chain
    os_llm_1:
        uses: OS Agent LLM
    os_tool_1:
        uses: OS Agent Tool
        depend_on: ["os_llm_1"]
    os_llm_2:
        uses: OS Agent LLM
        depend_on: ["os_tool_1"]

    # Chat Agent chain
    chat_llm_1:
        uses: Chat Agent LLM
    chat_tool_1:
        uses: Chat Agent Tool
        depend_on: ["chat_llm_1"]
    chat_llm_2:
        uses: Chat Agent LLM
        depend_on: ["chat_tool_1"]
