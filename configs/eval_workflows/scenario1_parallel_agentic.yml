# Scenario 1: Parallel Agentic Coding Workflow (Full Parallel)
# ============================================================
# Simulates a multi-agent software development pipeline where agents and tools
# fan out in parallel after a planning phase. This creates BOTH CPU and GPU
# contention simultaneously:
#
# CPU contention: DB queries (Docker+MySQL) + OS tool (Docker+bash) + RAG retrieval (FAISS)
# GPU contention: Chatbot (LLM) + ImageGen (Stable Diffusion) share GPU
#
# DAG:
#   planning (Chatbot-GPU) -->  code_gen (Chatbot-GPU)        \
#                          -->  design_docs (ImageGen-GPU)      \
#                          -->  test_data_setup (DbBench-CPU)    +--> integration (Chatbot-GPU)
#                          -->  env_setup (OsTool-CPU)          /
#                          -->  rag_search (Retriever-CPU)     /
#
# Insight: All 5 parallel tasks compete for CPU+GPU resources. Some tasks
# (test_data_setup, env_setup) have slack SLO and could be made sequential
# to reduce contention for latency-sensitive tasks (code_gen, design_docs).

Planning (chatbot):
    model: /home/cc/tally-bench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 5
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8080

Code Generation (chatbot):
    model: /home/cc/tally-bench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 15
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8080

Design Mockups (imagegen):
    model: /home/cc/tally-bench/ConsumerBench/models/sdxl-turbo
    num_requests: 5
    device: gpu
    type: ImageGen
    mps: 100

Test Data Setup (dbbench):
    type: DbBench
    num_requests: 5
    tool_kwargs:
        tool: sql
        query: "INSERT INTO grades (student_id, course, score) VALUES ('s001', 'CS101', 92);"
        num_runs: 1
        data_file: /home/cc/tally-bench/ConsumerBench/applications/DbBench/data_grades.jsonl

Environment Setup (ostool):
    type: OsTool
    num_requests: 3
    tool_kwargs:
        tool: bash
        num_runs: 1
        data_file: /home/cc/tally-bench/ConsumerBench/applications/OSTool/data/data_coding.json

RAG Documentation Search (retriever):
    type: RetrieverServer
    num_requests: 10
    device: cpu
    api_port: 8031

Integration Review (chatbot):
    model: /home/cc/tally-bench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8080

workflows:
    planning:
        uses: Planning (chatbot)

    # Phase 2: ALL tasks fan out in parallel (max contention)
    code_gen:
        uses: Code Generation (chatbot)
        depend_on: ["planning"]

    design_mockups:
        uses: Design Mockups (imagegen)
        depend_on: ["planning"]

    test_data_setup:
        uses: Test Data Setup (dbbench)
        depend_on: ["planning"]

    env_setup:
        uses: Environment Setup (ostool)
        depend_on: ["planning"]

    rag_search:
        uses: RAG Documentation Search (retriever)
        depend_on: ["planning"]

    # Phase 3: Integration depends on all parallel tasks
    integration:
        uses: Integration Review (chatbot)
        depend_on: ["code_gen", "design_mockups", "test_data_setup", "env_setup", "rag_search"]
