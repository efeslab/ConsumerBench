# Scenario 2: Model Reuse Pipeline (WITH model reuse)
# =====================================================
# Same pipeline as scenario2_model_reuse_no_reuse.yml, but with keep_model_loaded=true
# on LLM stages. The llama.cpp server stays alive across stages, eliminating
# redundant model loading overhead.
#
# DAG (fully sequential):
#   research (Chatbot, keep) --> outline (Chatbot, keep) --> draft (Chatbot, keep) -->
#   edit_review (Chatbot) --> generate_images (ImageGen) --> final_summary (Chatbot)
#
# The LLM model is loaded ONCE and kept alive through research->outline->draft->edit.
# Only unloaded before ImageGen (different model), then reloaded for final_summary.
#
# Insight: Model reuse eliminates 3 out of 5 model load/unload cycles, saving
# significant time. Scheduler-agnostic optimization that benefits all strategies.

Research Topic (chatbot):
    model: /home/cc/tally-bench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8080

Create Outline (chatbot):
    model: /home/cc/tally-bench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 8
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8080

Write Draft (chatbot):
    model: /home/cc/tally-bench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 15
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8080

Edit and Review (chatbot):
    model: /home/cc/tally-bench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8080

Generate Illustrations (imagegen):
    model: /home/cc/tally-bench/ConsumerBench/models/sdxl-turbo
    num_requests: 5
    device: gpu
    type: ImageGen
    mps: 100

Final Summary (chatbot):
    model: /home/cc/tally-bench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 5
    device: gpu
    type: Chatbot
    mps: 100
    api_port: 8080

workflows:
    research:
        uses: Research Topic (chatbot)
        keep_model_loaded: true

    outline:
        uses: Create Outline (chatbot)
        depend_on: ["research"]
        keep_model_loaded: true

    draft:
        uses: Write Draft (chatbot)
        depend_on: ["outline"]
        keep_model_loaded: true

    edit:
        uses: Edit and Review (chatbot)
        depend_on: ["draft"]
        # No keep_model_loaded - next stage is ImageGen (different model)

    illustrations:
        uses: Generate Illustrations (imagegen)
        depend_on: ["edit"]

    summary:
        uses: Final Summary (chatbot)
        depend_on: ["illustrations"]
