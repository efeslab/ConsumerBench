# Parallel Coding Agents Workflow (DAG-Informed Phasing)
# Same tasks as workflow_parallel_agents.yml, but restructured to reduce resource contention.
# Key difference: same-model agents (Frontend Chatbot + Backend DeepResearch) are serialized
# since they share the llama.cpp server. Meanwhile, UI Mockups (ImageGen, different model)
# runs in parallel with the LLM agents since it uses a separate GPU pipeline.
#
# This DAG-informed phasing avoids contention between latency-sensitive Chatbot requests
# and throughput-oriented DeepResearch requests sharing the same inference server.

Planning (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100

Frontend Code (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 15
    device: gpu
    type: Chatbot
    mps: 100

Backend Analysis (deep_research):
    server_model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    client_model: openai/meta-llama/Llama-3.2-3B-Instruct
    num_requests: 1
    device: gpu
    type: DeepResearch
    mps: 100

UI Mockups (imagegen):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/stable-diffusion-3.5-medium-turbo
    num_requests: 5
    device: gpu
    type: ImageGen
    mps: 100

Integration Review (chatbot):
    model: /home/yilegu/ConsumerBench/ConsumerBench/models/Llama-3.2-3B-Instruct-GGUF/Llama-3.2-3B-Instruct-f16.gguf
    num_requests: 10
    device: gpu
    type: Chatbot
    mps: 100

Demo Captions (live_captions):
    num_requests: 1
    device: gpu
    client_command_file: datasets/whisper-earnings21/5-min-chunks/4320211_chunk_002.wav
    mps: 100
    type: LiveCaptions

workflows:
    planning:
        uses: Planning (chatbot)

    # LLM agents serialized: Frontend first (latency-sensitive), then Backend
    frontend:
        uses: Frontend Code (chatbot)
        depend_on: ["planning"]

    backend:
        uses: Backend Analysis (deep_research)
        depend_on: ["frontend"]

    # ImageGen runs in parallel with LLM agents (different model, different GPU pipeline)
    mockups:
        uses: UI Mockups (imagegen)
        depend_on: ["planning"]

    # Integration depends on both backend analysis and mockups
    integration:
        uses: Integration Review (chatbot)
        depend_on: ["backend", "mockups"]

    # Demo captions after integration
    demo_captions:
        uses: Demo Captions (live_captions)
        depend_on: ["integration"]


